<svg width="320" height="74" viewBox="0 0 320 74" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rede Construai">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F47920"/>
      <stop offset="1" stop-color="#FFA63D"/>
    </linearGradient>
  </defs>
  <!-- marca: "C" em ferradura, aberto à direita -->
  <path d="M 56 21 A 22 22 0 1 0 56 53" stroke="url(#g)" stroke-width="11.5" stroke-linecap="round" fill="none"/>
  <!-- swoosh laranja no topo direito -->
  <path d="M 50 15 q 12 -3 18 5" stroke="url(#g)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- wordmark -->
  <text x="82" y="32" font-family="Poppins, Sora, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="5" fill="#9A9088">REDE</text>
  <text x="81" y="58" font-family="Poppins, Sora, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#F47920">CONSTRUAI</text>
</svg>
