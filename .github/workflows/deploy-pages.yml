name: Deploy to GitHub Pages

# Publica o site em https://rodolfornn.github.io/M-A/ a cada push na
# branch do site. Nao requer secrets: usa o GITHUB_TOKEN do proprio
# workflow (permissoes pages/id-token abaixo) e habilita o Pages
# automaticamente no primeiro deploy.

on:
  push:
    branches:
      - claude/construmaia-website-redesign-x21l6u
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
