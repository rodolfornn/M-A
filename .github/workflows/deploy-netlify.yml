name: Deploy to Netlify

# Publica o site no Netlify a cada push nas branches abaixo.
# Roda na infra do GitHub (sem o bloqueio de rede do ambiente de dev).
#
# Pre-requisito: cadastrar 2 secrets no repositorio
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     NETLIFY_AUTH_TOKEN  -> seu personal access token do Netlify
#     NETLIFY_SITE_ID     -> o API ID do site (Site settings -> General -> Site ID)
#                            Para o primeiro deploy/criar site, veja DEPLOY.md.

on:
  push:
    branches:
      - claude/construmaia-website-redesign-x21l6u
      - claude/construai-investor-pitch-44iKA
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: '.'
          production-deploy: true
          deploy-message: "Deploy ${{ github.sha }} - ${{ github.ref_name }}"
          enable-pull-request-comment: false
          enable-commit-comment: true
          fails-without-credentials: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
